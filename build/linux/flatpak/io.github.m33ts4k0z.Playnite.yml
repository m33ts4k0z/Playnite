id: io.github.m33ts4k0z.Playnite
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: playnite

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=all
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.*

modules:
  - name: playnite
    buildsystem: simple
    sources:
      - type: dir
        path: payload
      - type: file
        path: systemctl-host
      - type: file
        path: loginctl-host
    build-commands:
      - cp -a bin lib share /app/
      - install -Dm0755 systemctl-host /app/bin/systemctl
      - install -Dm0755 loginctl-host /app/bin/loginctl
